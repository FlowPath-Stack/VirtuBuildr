<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROAKFALL — Pond Wars (Prototype)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0a1f14; }
  canvas { display: block; }
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    font-family: "Trebuchet MS", Verdana, sans-serif; color: #eafff2;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #title {
    position: absolute; top: 14px; left: 18px; font-size: 22px; font-weight: 800;
    letter-spacing: 2px; color: #b8ff7a;
  }
  #title small { display: block; font-size: 11px; letter-spacing: 4px; color: #eafff2; opacity: .8; }
  #score {
    position: absolute; top: 16px; right: 18px; text-align: right; font-size: 15px;
  }
  #score b { color: #ffd857; font-size: 22px; }
  #status {
    position: absolute; top: 72px; right: 18px; font-size: 11px; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 10px; background: rgba(0,0,0,.35);
  }
  #status.online { color: #7dffb0; }
  #status.offline { color: #ffb37d; }
  #help {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12px; opacity: .85; background: rgba(0,0,0,.35);
    padding: 6px 14px; border-radius: 12px; white-space: nowrap;
  }
  #toast {
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; color: #ffd857; opacity: 0;
    transition: opacity .3s;
  }
</style>
</head>
<body>
<div id="hud">
  <div id="title">CROAKFALL<small>POND WARS &mdash; PROTOTYPE</small></div>
  <div id="score">FLIES EATEN <b id="flies">0</b><br><span id="pop">1 frog in the pond</span></div>
  <div id="status" class="offline">OFFLINE &middot; BOT FROGS</div>
  <div id="help">WASD hop &nbsp;&bull;&nbsp; SPACE big jump &nbsp;&bull;&nbsp; CLICK tongue-snap a fly &nbsp;&bull;&nbsp; C croak</div>
  <div id="toast"></div>
</div>
<script type="module">
import * as THREE from './vendor/three.module.js';

// ---------------------------------------------------------------- constants
const POND_RADIUS = 55;
const WATER_Y = 0;
const GRAVITY = -22;
const HOP_SPEED = 7.5;
const HOP_UP = 5.5;
const BIG_HOP_SPEED = 11;
const BIG_HOP_UP = 9;
const TONGUE_RANGE = 9;
const NET_RATE_MS = 100;

const FROG_NAMES = ['Sir Ribbitsworth', 'Padwina', 'Hopscotch', 'Bogart', 'Lily Vander-Pond',
  'Croakus Maximus', 'Jumpelstiltskin', 'Tad Pole', 'Warty Harry', 'Peeper'];
const FROG_COLORS = [0x4caf50, 0x7cb342, 0x26a69a, 0x9ccc65, 0x66bb6a, 0x00897b, 0xaed581, 0x43a047];

const params = new URLSearchParams(location.search);
const myName = params.get('name') || FROG_NAMES[Math.floor(Math.random() * FROG_NAMES.length)];
const serverUrl = params.get('server') ||
  (location.protocol === 'https:' ? null : 'ws://' + (location.hostname || 'localhost') + ':8080');

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c5eb);
scene.fog = new THREE.Fog(0x87c5eb, 60, 140);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);

const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x2e5e33, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2cc, 1.6);
sun.position.set(30, 45, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
scene.add(sun);

// ---------------------------------------------------------------- pond world
const water = new THREE.Mesh(
  new THREE.CircleGeometry(POND_RADIUS, 64),
  new THREE.MeshStandardMaterial({ color: 0x2e7fa8, roughness: 0.25, metalness: 0.1, transparent: true, opacity: 0.92 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = WATER_Y;
water.receiveShadow = true;
scene.add(water);

const shore = new THREE.Mesh(
  new THREE.RingGeometry(POND_RADIUS - 0.5, POND_RADIUS + 60, 64),
  new THREE.MeshStandardMaterial({ color: 0x5d8a3c, roughness: 1 })
);
shore.rotation.x = -Math.PI / 2;
shore.position.y = WATER_Y + 0.02;
shore.receiveShadow = true;
scene.add(shore);

// lily pads — these are the platforms frogs stand on
const pads = [];
const padGeo = new THREE.CylinderGeometry(1, 1, 0.12, 24, 1, false, 0.35, Math.PI * 2 - 0.35);
const padMat = new THREE.MeshStandardMaterial({ color: 0x3e8e41, roughness: 0.8 });
for (let i = 0; i < 34; i++) {
  const r = 4 + Math.random() * (POND_RADIUS - 8);
  const a = Math.random() * Math.PI * 2;
  const scale = 1.4 + Math.random() * 1.8;
  const pad = new THREE.Mesh(padGeo, padMat);
  pad.scale.set(scale, 1, scale);
  pad.position.set(Math.cos(a) * r, WATER_Y + 0.1, Math.sin(a) * r);
  pad.rotation.y = Math.random() * Math.PI * 2;
  pad.castShadow = pad.receiveShadow = true;
  pad.userData = { radius: scale, bobPhase: Math.random() * Math.PI * 2 };
  scene.add(pad);
  pads.push(pad);
}

// cattails and rocks around the shore
const stalkMat = new THREE.MeshStandardMaterial({ color: 0x6b8f3a, roughness: 1 });
const headMat = new THREE.MeshStandardMaterial({ color: 0x6d4c2f, roughness: 1 });
for (let i = 0; i < 60; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = POND_RADIUS + 1 + Math.random() * 6;
  const h = 2 + Math.random() * 2.5;
  const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, h, 6), stalkMat);
  stalk.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
  stalk.rotation.z = (Math.random() - 0.5) * 0.15;
  const head = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.7, 4, 8), headMat);
  head.position.set(stalk.position.x, h + 0.2, stalk.position.z);
  stalk.castShadow = head.castShadow = true;
  scene.add(stalk, head);
}
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8d8d84, roughness: 1 });
for (let i = 0; i < 18; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = POND_RADIUS + 2 + Math.random() * 15;
  const s = 0.6 + Math.random() * 1.6;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), rockMat);
  rock.position.set(Math.cos(a) * r, s * 0.4, Math.sin(a) * r);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = rock.receiveShadow = true;
  scene.add(rock);
}

// ---------------------------------------------------------------- frog factory
function makeNameSprite(text, color) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 96;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 52px Trebuchet MS, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 10; ctx.lineJoin = 'round';
  ctx.strokeText(text, 256, 48);
  ctx.fillStyle = color;
  ctx.fillText(text, 256, 48);
  const tex = new THREE.CanvasTexture(cv);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sprite.scale.set(4.4, 0.82, 1);
  sprite.position.y = 2.1;
  return sprite;
}

function makeFrog(color, name, nameColor = '#ffffff') {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const bellyMat = new THREE.MeshStandardMaterial({ color: 0xf5f0d0, roughness: 0.7 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 20, 16), mat);
  body.scale.set(1, 0.78, 1.25);
  body.position.y = 0.52;
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.52, 16, 12), bellyMat);
  belly.scale.set(1, 0.7, 1.15);
  belly.position.set(0, 0.42, 0.08);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), mat);
  head.scale.set(1.05, 0.75, 0.9);
  head.position.set(0, 0.78, 0.62);

  const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xfffbe8, roughness: 0.3 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x14140f, roughness: 0.2 });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 12), eyeWhiteMat);
    eye.position.set(side * 0.28, 1.1, 0.72);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), pupilMat);
    pupil.position.set(side * 0.28, 1.12, 0.86);
    g.add(eye, pupil);

    // back legs — big folded haunches
    const haunch = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 12), mat);
    haunch.scale.set(0.8, 0.9, 1.2);
    haunch.position.set(side * 0.55, 0.36, -0.42);
    // front legs
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.35, 4, 8), mat);
    arm.position.set(side * 0.42, 0.28, 0.5);
    arm.rotation.x = 0.4;
    // feet
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), mat);
    foot.scale.set(1.4, 0.4, 1.8);
    foot.position.set(side * 0.6, 0.06, -0.1);
    g.add(haunch, arm, foot);
  }

  g.add(body, belly, head);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });

  const nameSprite = makeNameSprite(name, nameColor);
  g.add(nameSprite);

  // tongue: a stretched cylinder we scale toward a target when snapping
  const tongue = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.07, 1, 8),
    new THREE.MeshStandardMaterial({ color: 0xff6a8a, roughness: 0.4 })
  );
  tongue.visible = false;
  g.add(tongue);

  return { group: g, body, tongue, tongueT: 0, tongueTarget: new THREE.Vector3() };
}

// ---------------------------------------------------------------- flies
const flies = [];
const flyGeo = new THREE.SphereGeometry(0.12, 8, 6);
const flyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
function spawnFly() {
  const fly = new THREE.Group();
  fly.add(new THREE.Mesh(flyGeo, flyMat));
  for (const side of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.1), wingMat);
    wing.position.set(side * 0.12, 0.08, 0);
    fly.add(wing);
  }
  const r = 3 + Math.random() * (POND_RADIUS - 6);
  const a = Math.random() * Math.PI * 2;
  fly.position.set(Math.cos(a) * r, 1 + Math.random() * 1.5, Math.sin(a) * r);
  fly.userData = {
    phase: Math.random() * Math.PI * 2,
    center: fly.position.clone(),
    speed: 0.6 + Math.random() * 0.8,
  };
  scene.add(fly);
  flies.push(fly);
}
for (let i = 0; i < 14; i++) spawnFly();

function updateFlies(t, dt) {
  for (const fly of flies) {
    const u = fly.userData;
    u.center.x += Math.sin(t * u.speed + u.phase) * dt * 2;
    u.center.z += Math.cos(t * u.speed * 0.7 + u.phase * 2) * dt * 2;
    const d = Math.hypot(u.center.x, u.center.z);
    if (d > POND_RADIUS - 2) { u.center.x *= 0.99; u.center.z *= 0.99; }
    fly.position.set(
      u.center.x + Math.sin(t * 7 + u.phase) * 0.3,
      1.2 + Math.sin(t * 3 + u.phase) * 0.6,
      u.center.z + Math.cos(t * 6 + u.phase) * 0.3
    );
  }
}

// ---------------------------------------------------------------- audio (starts on first gesture)
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function croakSound() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), gain = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(140, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.25);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
  o.connect(gain).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.3);
}
function slurpSound() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), gain = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(300, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  o.connect(gain).connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.15);
}

// ---------------------------------------------------------------- player
const myColor = FROG_COLORS[Math.floor(Math.random() * FROG_COLORS.length)];
const me = makeFrog(myColor, myName, '#b8ff7a');
me.group.position.set(0, WATER_Y, 0);
scene.add(me.group);

const player = {
  pos: me.group.position,
  vel: new THREE.Vector3(),
  heading: 0,
  grounded: true,
  hopCooldown: 0,
  score: 0,
};

function groundHeightAt(x, z) {
  for (const pad of pads) {
    const dx = x - pad.position.x, dz = z - pad.position.z;
    if (dx * dx + dz * dz < pad.userData.radius * pad.userData.radius) return pad.position.y + 0.06;
  }
  if (Math.hypot(x, z) > POND_RADIUS) return WATER_Y + 0.05; // shore
  return WATER_Y - 0.18; // swimming, slightly sunk
}

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  ensureAudio();
  if (e.code === 'KeyC') doCroak(me, true);
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

function hop(entity, dir, big) {
  entity.vel.x = Math.sin(dir) * (big ? BIG_HOP_SPEED : HOP_SPEED);
  entity.vel.z = Math.cos(dir) * (big ? BIG_HOP_SPEED : HOP_SPEED);
  entity.vel.y = big ? BIG_HOP_UP : HOP_UP;
  entity.grounded = false;
}

function stepPhysics(entity, group, dt) {
  if (!entity.grounded) {
    entity.vel.y += GRAVITY * dt;
    entity.pos.addScaledVector(entity.vel, dt);
    const gy = groundHeightAt(entity.pos.x, entity.pos.z);
    if (entity.vel.y < 0 && entity.pos.y <= gy) {
      entity.pos.y = gy;
      entity.vel.set(0, 0, 0);
      entity.grounded = true;
    }
  } else {
    // settle onto whatever is under us (pads bob, water drifts)
    entity.pos.y += (groundHeightAt(entity.pos.x, entity.pos.z) - entity.pos.y) * Math.min(1, dt * 10);
  }
  // keep everyone in the world
  const d = Math.hypot(entity.pos.x, entity.pos.z);
  const maxR = POND_RADIUS + 12;
  if (d > maxR) { entity.pos.x *= maxR / d; entity.pos.z *= maxR / d; }
  group.position.copy(entity.pos);
  group.rotation.y = entity.heading;
  // squash & stretch
  const air = entity.grounded ? 0 : 1;
  group.scale.y += ((1 + air * 0.15) - group.scale.y) * Math.min(1, dt * 12);
}

// ---------------------------------------------------------------- tongue snap
function tryTongue(frog, entity, isMe) {
  let best = null, bestScore = Infinity;
  const fwd = new THREE.Vector3(Math.sin(entity.heading), 0, Math.cos(entity.heading));
  for (const fly of flies) {
    const to = fly.position.clone().sub(entity.pos);
    const dist = to.length();
    if (dist > TONGUE_RANGE) continue;
    const facing = fwd.dot(to.clone().setY(0).normalize());
    if (isMe && facing < 0.2) continue; // player must roughly face the fly
    if (dist < bestScore) { bestScore = dist; best = fly; }
  }
  if (!best) return false;
  frog.tongueT = 1;
  frog.tongueTarget.copy(best.position);
  // eat it: respawn elsewhere
  scene.remove(best);
  flies.splice(flies.indexOf(best), 1);
  spawnFly();
  if (isMe) {
    player.score++;
    document.getElementById('flies').textContent = player.score;
    slurpSound();
    if (player.score > 0 && player.score % 10 === 0) toast('RIBBIT LEVEL UP!');
  }
  return true;
}

function updateTongue(frog, dt) {
  if (frog.tongueT <= 0) { frog.tongue.visible = false; return; }
  frog.tongueT = Math.max(0, frog.tongueT - dt * 4);
  const mouth = frog.group.position.clone().add(new THREE.Vector3(0, 0.75, 0));
  const reach = Math.sin(frog.tongueT * Math.PI); // out and back
  const tip = mouth.clone().lerp(frog.tongueTarget, reach);
  const mid = mouth.clone().lerp(tip, 0.5);
  const len = Math.max(0.01, mouth.distanceTo(tip));
  frog.tongue.visible = true;
  frog.tongue.position.copy(frog.group.worldToLocal(mid.clone()));
  frog.tongue.scale.set(1, len, 1);
  frog.tongue.lookAt(frog.group.worldToLocal(tip.clone()).add(frog.tongue.position));
  frog.tongue.rotateX(Math.PI / 2);
}

addEventListener('mousedown', () => { ensureAudio(); tryTongue(me, player, true); });

// ---------------------------------------------------------------- croak bubbles
function doCroak(frog, isMe) {
  croakSound();
  const bubble = makeNameSprite('ribbit!', '#ffd857');
  bubble.position.y = 2.8;
  frog.group.add(bubble);
  setTimeout(() => frog.group.remove(bubble), 900);
  if (isMe && net.ws && net.ws.readyState === 1) net.ws.send(JSON.stringify({ type: 'croak' }));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1400);
}

// ---------------------------------------------------------------- other frogs: bots OR network players
const others = new Map(); // id -> {frog, entity, isBot, targetPos, name}

function addOther(id, name, color, isBot) {
  const frog = makeFrog(color, name, isBot ? '#cfd8dc' : '#7dffb0');
  const r = 5 + Math.random() * (POND_RADIUS - 10);
  const a = Math.random() * Math.PI * 2;
  const entity = {
    pos: frog.group.position,
    vel: new THREE.Vector3(),
    heading: Math.random() * Math.PI * 2,
    grounded: true,
    hopCooldown: 1 + Math.random() * 2,
  };
  entity.pos.set(Math.cos(a) * r, WATER_Y, Math.sin(a) * r);
  scene.add(frog.group);
  others.set(id, { frog, entity, isBot, name, netPos: new THREE.Vector3(), netHeading: 0 });
  updatePop();
}
function removeOther(id) {
  const o = others.get(id);
  if (o) { scene.remove(o.frog.group); others.delete(id); updatePop(); }
}
function updatePop() {
  const n = others.size + 1;
  document.getElementById('pop').textContent = n + (n === 1 ? ' frog' : ' frogs') + ' in the pond';
}

function updateBots(dt) {
  for (const o of others.values()) {
    if (!o.isBot) continue;
    const e = o.entity;
    e.hopCooldown -= dt;
    if (e.grounded && e.hopCooldown <= 0) {
      // hop toward the nearest fly sometimes, otherwise wander
      let dir = Math.random() * Math.PI * 2;
      let nearest = null, nd = Infinity;
      for (const fly of flies) {
        const d = fly.position.distanceTo(e.pos);
        if (d < nd) { nd = d; nearest = fly; }
      }
      if (nearest && Math.random() < 0.6) {
        dir = Math.atan2(nearest.position.x - e.pos.x, nearest.position.z - e.pos.z);
      }
      // stay near the pond
      if (Math.hypot(e.pos.x, e.pos.z) > POND_RADIUS - 3 && Math.random() < 0.8) {
        dir = Math.atan2(-e.pos.x, -e.pos.z) + (Math.random() - 0.5);
      }
      e.heading = dir;
      hop(e, dir, Math.random() < 0.2);
      e.hopCooldown = 0.6 + Math.random() * 2.2;
      if (Math.random() < 0.05) doCroak(o.frog, false);
    }
    if (e.grounded && Math.random() < dt * 0.4) tryTongue(o.frog, e, false);
    stepPhysics(e, o.frog.group, dt);
    updateTongue(o.frog, dt);
  }
}

// ---------------------------------------------------------------- networking
const net = { ws: null, id: null, lastSend: 0 };
const statusEl = document.getElementById('status');

function connect() {
  if (!serverUrl) return spawnBots();
  let opened = false;
  try { net.ws = new WebSocket(serverUrl); } catch { return spawnBots(); }
  net.ws.onopen = () => {
    opened = true;
    net.ws.send(JSON.stringify({ type: 'join', name: myName, color: myColor }));
    statusEl.textContent = 'ONLINE · ' + serverUrl.replace(/^wss?:\/\//, '');
    statusEl.className = 'online';
  };
  net.ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'welcome') {
      net.id = msg.id;
      for (const p of msg.players) if (p.id !== net.id) addOther(p.id, p.name, p.color, false);
    } else if (msg.type === 'join' && msg.id !== net.id) {
      addOther(msg.id, msg.name, msg.color, false);
      toast(msg.name + ' hopped in!');
    } else if (msg.type === 'leave') {
      removeOther(msg.id);
    } else if (msg.type === 'state') {
      for (const p of msg.players) {
        if (p.id === net.id) continue;
        const o = others.get(p.id);
        if (o) { o.netPos.set(p.x, p.y, p.z); o.netHeading = p.ry; }
      }
    } else if (msg.type === 'croak') {
      const o = others.get(msg.id);
      if (o) doCroak(o.frog, false);
    }
  };
  net.ws.onerror = () => { if (!opened) fallbackToBots(); };
  net.ws.onclose = () => { if (!opened) fallbackToBots(); else { statusEl.textContent = 'DISCONNECTED · BOT FROGS'; statusEl.className = 'offline'; fallbackToBots(true); } };
}

let botsSpawned = false;
function fallbackToBots(clearFirst) {
  net.ws = null;
  if (clearFirst) for (const id of [...others.keys()]) removeOther(id);
  spawnBots();
}

function spawnBots() {
  if (botsSpawned) return; // onerror and onclose can both fire on a failed connect
  botsSpawned = true;
  const used = new Set([myName]);
  for (let i = 0; i < 6; i++) {
    let name;
    do { name = FROG_NAMES[Math.floor(Math.random() * FROG_NAMES.length)]; } while (used.has(name));
    used.add(name);
    addOther('bot' + i, name, FROG_COLORS[(i * 3 + 1) % FROG_COLORS.length], true);
  }
}

function netUpdate(now) {
  if (!net.ws || net.ws.readyState !== 1) return;
  if (now - net.lastSend < NET_RATE_MS) return;
  net.lastSend = now;
  net.ws.send(JSON.stringify({
    type: 'state',
    x: +player.pos.x.toFixed(2), y: +player.pos.y.toFixed(2), z: +player.pos.z.toFixed(2),
    ry: +player.heading.toFixed(2),
  }));
}

function updateRemotes(dt) {
  for (const o of others.values()) {
    if (o.isBot) continue;
    // simple interpolation toward last received state
    o.entity.pos.lerp(o.netPos, Math.min(1, dt * 10));
    let dh = o.netHeading - o.entity.heading;
    while (dh > Math.PI) dh -= Math.PI * 2;
    while (dh < -Math.PI) dh += Math.PI * 2;
    o.entity.heading += dh * Math.min(1, dt * 10);
    o.frog.group.position.copy(o.entity.pos);
    o.frog.group.rotation.y = o.entity.heading;
    updateTongue(o.frog, dt);
  }
}

connect();

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // input → hops
  player.hopCooldown -= dt;
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz -= 1;
  if (keys.KeyS || keys.ArrowDown) iz += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (player.grounded && player.hopCooldown <= 0 && (ix || iz || keys.Space)) {
    if (ix || iz) player.heading = Math.atan2(ix, iz) + Math.PI; // camera-relative-ish: W = away from camera
    hop(player, player.heading, !!keys.Space);
    player.hopCooldown = 0.28;
  }
  stepPhysics(player, me.group, dt);
  updateTongue(me, dt);

  updateFlies(t, dt);
  updateBots(dt);
  updateRemotes(dt);
  netUpdate(performance.now());

  // bob the lily pads
  for (const pad of pads) pad.position.y = WATER_Y + 0.1 + Math.sin(t * 1.2 + pad.userData.bobPhase) * 0.04;

  // gentle water shimmer
  water.material.color.setHSL(0.55, 0.55, 0.4 + Math.sin(t * 0.8) * 0.02);

  // camera follows behind the player
  const camTarget = new THREE.Vector3(player.pos.x, player.pos.y + 2.5, player.pos.z + 9);
  camera.position.lerp(camTarget, Math.min(1, dt * 4));
  camera.lookAt(player.pos.x, player.pos.y + 1, player.pos.z);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
